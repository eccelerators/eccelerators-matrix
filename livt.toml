[project]
name = "Eccelerators.Matrix"
version = "1.0.0"
path = "src"
outdir = "out"

[dependencies]
"Livt.Math" = "1.4.0"

[tests]
path = "tests"
components = [
    "MatrixRendererTest",
    "MatrixRendererPacingTest",
    "ColorConverterTest",
    "ColorGainTest",
    "ConvertedPainterTest",
    "MatrixFramePacerTest",
    "Hub75Display4Test",
    "Hub75Display6Test",
    "Hub75ChainTest",
    "MatrixColorTest",
    "Hub75ColorTest",
    "Hub75Color6Test",
    "MatrixPictureSequenceTest",
    "MatrixPictureHoldTest",
    "Hub75FramebufferTest",
    "Hub75GeometryTest",
    "MatrixPipelineTest",
    "Hub75Clock50Test",
    "Hub75Clock100Test",
    "Hub75Clock75Test",
]

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]
